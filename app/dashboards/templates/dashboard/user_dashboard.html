<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Utilisateur</title>

</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul class="sidebar-menu">
    {% for menu in menus %}
        <li>
            <a href="{% url menu.url_name %}">
                {% if menu.icon_class %}
                    <i class="{{ menu.icon_class }}"></i>
                {% endif %}
                {{ menu.menu_name }}
                <!-- Affichage du statut -->
                <span class="badge">
                    {% if menu.status == "available" %}
                        Disponible
                    {% elif menu.status == "coming_soon" %}
                        Bientôt
                    {% endif %}
                </span>
            </a>
        </li>
    {% endfor %}
</ul>

        </aside>

        <main class="content">
            <h1>Bienvenue sur votre dashboard</h1>
            <p>Contenu principal du dashboard ici.</p>
        </main>
    </div>
</body>
</html>

<style>
.dashboard-wrapper {
    display: flex;
    min-height: 100vh;
}
.sidebar {
    width: 250px;
    background-color: #f5f5f5;
    padding: 20px;
}
.sidebar-menu li {
    list-style: none;
    margin: 10px 0;
}
.sidebar-menu a {
    text-decoration: none;
    color: #333;
    display: flex;
    align-items: center;
}
.sidebar-menu i {
    margin-right: 8px;
}
.badge {
    background-color: orange;
    color: white;
    padding: 2px 6px;
    font-size: 0.7em;
    border-radius: 3px;
    margin-left: 5px;
}
.content {
    flex: 1;
    padding: 20px;
}
</style>
