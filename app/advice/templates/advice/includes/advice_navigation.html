{% load wagtailcore_tags wagtailimages_tags %}
<nav class="advice-nav" aria-label="Catégories d'articles">
    <ul class="advice-nav__list">
      <li class="advice-nav__item"><a href="?category=chien">Chien</a></li>
      <li class="advice-nav__item"><a href="?category=chat">Chat</a></li>
      <li class="advice-nav__item"><a href="?category=bon_a_savoir">Bon à savoir</a></li>
      <li class="advice-nav__item"><a href="?category=guide">Guide</a></li>
    </ul>
  </nav>

  <div class="advice-search">

    <form method="get" class="search-input" role="search">
      <svg class="search-input__icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <input type="text"
           name="q"
           value="{{ q }}"
           placeholder="Rechercher un article"
           aria-label="Rechercher des articles"
           class="search-input__input" />
    {% if category %}
    <input type="hidden" name="category" value="{{ category }}" />
    {% endif %}
    <button type="submit" class="search-input__submit">Rechercher</button>
  </form>
</div>
