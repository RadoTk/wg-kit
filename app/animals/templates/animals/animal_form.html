<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="form-row">
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
        {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
      </div>
    {% endfor %}
    <button type="submit">Enregistrer</button>
  </form>
