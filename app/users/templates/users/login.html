{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Connexion</h2>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Se connecter</button>
    </form>

    <p class="switch">
        Pas encore de compte ?
        <a href="{% url 'users:signup' %}">Créer un compte</a>
    </p>
</div>

<style>
.auth-container {
    max-width: 450px;
    margin: 2rem auto;
    padding: 1.5rem;
    background: #f7f7f7;
    border-radius: 6px;
}
.auth-container h2 {
    text-align: center;
}
button {
    width: 100%;
    padding: 0.7rem;
    font-size: 1rem;
    background: #0077cc;
    color: white;
    border: none;
    border-radius: 4px;
}
.switch {
    margin-top: 1rem;
    text-align: center;
}
.messages li.error { background: #ffdddd; padding: .5rem; }
</style>
{% endblock %}
